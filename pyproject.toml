[project]
name = "wiki-game"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "numpy>=2.5.4",
    "wandb>=0.31.0",
]

[dependency-groups]
app = [
    "networkx>=3.7",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
]
dev = [
    "kaleido>=1.5.0",
    "pytest>=9.2.0",
]
llm = [
    "accelerate>=1.15.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wikigame"
