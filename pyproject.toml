[project]
name = "wiki-game"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "numpy>=2.3.5,<2.5",  # vllm 0.32 -> numba 0.65 needs numpy < 2.5
    "wandb>=0.31.0",
]

[dependency-groups]
app = [
    "networkx>=3.7",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.67.0",
]
dev = [
    "kaleido>=1.5.0",
    "pytest>=9.2.0",
]
llm = [
    "accelerate>=1.15.0",
    "peft>=0.21.2",
    # pinned to what vllm 0.32 (the newest vLLM TRL 1.17 accepts) requires, so trainer and vLLM share one environment
    "torch==2.13.0",
    "transformers>=5.19.0,<5.20",
    "trl>=1.17.1",
]
# fast generation for training rollouts and evals; Linux + CUDA only (no macOS wheels), the Mac falls back to HF generate
vllm = [
    "vllm==0.32.0; sys_platform == 'linux'",
]

# torch 2.13 from PyPI: the Linux wheel is the CUDA 13.0 build (includes sm_120 Blackwell); macOS gets the MPS wheel.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wikigame"
